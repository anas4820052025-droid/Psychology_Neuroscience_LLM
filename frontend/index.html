<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Psychology & Neuroscience Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">Evidence-grounded education</p>
        <h1>Psychology &amp; Neuroscience Assistant</h1>
        <p class="intro">Ask a general question. Answers are based on the project’s curated knowledge base.</p>
      </header>

      <section class="notice" aria-label="Important notice">
        This tool provides educational information only. It is not a therapist, doctor, or emergency service.
      </section>

      <section id="conversation" class="conversation" aria-live="polite">
        <div class="message assistant">What would you like to learn about?</div>
      </section>

      <form id="question-form" class="question-form">
        <label for="question">Your question</label>
        <textarea id="question" name="question" rows="3" maxlength="2000" required placeholder="For example: How can psychotherapy help people with depression?"></textarea>
        <div class="form-footer">
          <span id="status" role="status"></span>
          <button id="submit-button" type="submit">Ask question</button>
        </div>
      </form>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
